name: Frontend CI/CD

on:
  push:
    branches: [test-server, development, main]
  pull_request:
    branches: [test-server, development, main]

jobs:
  test:
    name: Lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Fall back to the EC2 backend (same as .env.production) when the repo variables aren't set,
          # so the CI build is never baked with an empty API address.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://3.108.220.220/api/v1' }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'http://3.108.220.220' }}
          VITE_MOCK_AUTH: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages (test-server)
    needs: test
    # Skipped until Cloudflare Pages is configured (repo variable CLOUDFLARE_PAGES_PROJECT plus the
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets — see deploy/README.md). Unconfigured, this
    # job failed in 3 seconds on every push and emailed a failure. The live frontend is the nginx site
    # on the EC2 box (/var/www/dsf-erp-frontend), updated by hand for now.
    if: github.ref == 'refs/heads/test-server' && github.event_name == 'push' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: dist
          branch: test-server
